[versions]
commonsCodec = "1.22.1"
commonsIo = "2.22.0"
kotlin = "2.4.20"
gradle = "8.13.2"
appcompat = "1.8.0"
zip4j = "2.11.6"
junit = "6.1.3"
junitKtx = "1.3.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
junit = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
androidx-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junitKtx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "gradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
lalaki-central = { id = "cn.lalaki.central", version = "3.0.3" }
lalaki-andresguard = { id = "cn.lalaki.AndResGuard", version = "2.0.4" }
